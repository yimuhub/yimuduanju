name: Desktop Release (macOS / Windows / Linux)

# 推送 v* 标签时，三平台并行构建 Tauri 桌面客户端并发布 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macOS (Apple Silicon)
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
            label: macOS (Intel)
          - os: windows-latest
            args: ''
            label: Windows
          - os: ubuntu-22.04
            args: ''
            label: Linux (deb/AppImage)

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux 前置依赖（webkit2gtk）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端产物
        run: |
          npm run build:client
          npm run build:server

      - name: 打包桌面客户端（Tauri）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx @tauri-apps/cli
          args: ${{ matrix.args }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: yimu-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.app
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
