name: Desktop Build

# 三平台桌面客户端构建：Mac(arm64/x64) / Windows(x64) / Linux(x64)
# 产物为「全量自包含」安装包：内置 Node 运行时 + PostgreSQL + ffmpeg，
# 由 scripts/desktop-pack.js 生成运行时目录，再交给 Tauri 打进安装包。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 国内 runner 或需要加速时可改；GitHub 官方 runner 直接用 npmjs
  YIMU_NPM_REGISTRY: https://registry.npmjs.org
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 / macos-14 已被 GitHub 陆续下线（macos-14 任务会秒 cancelled、
          # macos-13 永远 queued）。统一用当前在役的 macos-15 系列。
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.os }}
    env:
      # 配了 Apple 开发者证书的 secrets 时，macOS 走 Developer ID 签名 + 公证（用户双击即开）；
      # 没配则 scripts/macos-bundle.sh 退化为 ad-hoc 签名 —— 封条完整，不会出现「已损坏」。
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Linux 系统依赖（WebKitGTK / 打包工具）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm libxdo-dev libssl-dev libsecret-1-dev \
            libfuse2 build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 构建前端与后端
        run: npm run build:prod

      - name: 确保 ffmpeg 可用（会被打进安装包）
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "已存在：$(command -v ffmpeg)"
            ffmpeg -version | head -1
            exit 0
          fi
          case "${{ matrix.os }}" in
            windows-*) choco install ffmpeg -y --no-progress ;;
            ubuntu-*)  sudo apt-get install -y ffmpeg ;;
            *)         brew install ffmpeg ;;
          esac
          ffmpeg -version | head -1

      - name: 生成自包含运行时（Node + PostgreSQL + ffmpeg）
        run: node scripts/desktop-pack.js --skip-build

      - name: 校验运行时自包含（缺一件就失败，不允许出半成品包）
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = path.join("build", "desktop-app");
            const win = process.platform === "win32";
            const must = [
              win ? "node.exe" : "node",
              path.join("bin", win ? "ffmpeg.exe" : "ffmpeg"),
              path.join("dist", "server", "main.js"),
              "launch.cjs",
              path.join("node_modules", "embedded-postgres"),
            ];
            const missing = must.filter((f) => !fs.existsSync(path.join(dir, f)));
            if (missing.length) {
              console.error("运行时缺件：" + missing.join(", "));
              process.exit(1);
            }
            const pg = path.join(dir, "node_modules", "@embedded-postgres",
              (process.platform === "win32" ? "windows" : process.platform) + "-" + process.arch,
              "native", "bin");
            if (!fs.existsSync(pg)) {
              console.error("缺少本平台 PostgreSQL 二进制：" + pg);
              process.exit(1);
            }
            console.log("自包含校验通过：" + must.join(", "));
          '

      - name: 导入 macOS 签名证书（配置了 secrets 才执行）
        if: startsWith(matrix.os, 'macos') && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/yimu-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p yimu-ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p yimu-ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k yimu-ci "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning

      - name: 打包桌面客户端
        shell: bash
        run: |
          # Linux 只出 deb：AppImage/rpm 在 GitHub runner 上依赖 FUSE/rpmbuild，
          # 容易在“打包”阶段整体失败；deb 是本项目 Linux 的正式安装包。
          #
          # productName 是中文「一幕短剧」（macOS/Windows 的显示名），但 deb 的包名
          # 必须是 ASCII 小写，否则 dpkg 直接拒绝。因此 Linux 用 --config 覆盖成
          # yimu-desktop，只影响包名，不影响三个平台的显示名。
          #
          # macOS 走 scripts/macos-bundle.sh：出 .app → 签名（有证书用 Developer ID，
          # 没有则 ad-hoc）→ 校验封条 → 生成 DMG → 再校验 DMG 内的封条。
          # 绕开 Tauri 自带 DMG 的 Finder AppleEvent 超时。
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            (cd desktop && npx --yes @tauri-apps/cli@2 build \
              --target ${{ matrix.target }} --bundles deb \
              --config '{"productName":"yimu-desktop"}')
          elif [ "${{ matrix.os }}" = "macos-15" ] || [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            bash scripts/macos-bundle.sh ${{ matrix.target }}
          else
            (cd desktop && npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }})
          fi

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: yimu-${{ matrix.label }}
          # dmg / app / exe / msi / AppImage / deb 一次收齐
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  release:
    # 只有推版本标签（v3.7.3 这种）才发正式 Release，手动触发只留 artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 归并安装包
        run: |
          mkdir -p out
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -lh out

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            一幕短剧（YIMU）${{ github.ref_name }} —— 全量自包含安装包

            每个安装包内部已携带 Node 运行时、PostgreSQL 16 与 ffmpeg，
            安装后双击即可使用，无需另装任何环境。数据保存在本机用户目录
            （`~/.yimu-desktop`，Windows 为 `%USERPROFILE%\.yimu-desktop`）。

            macOS 包名为 `YIMU_*.dmg`，安装后应用显示名是「一幕短剧」。
            若首次打开被系统拦下，右键点图标选「打开」，或执行
            `xattr -cr "/Applications/一幕短剧.app"` 即可。

            也可以只用 Docker：
            ```
            docker run -d -p 5173:5173 -v yimu-data:/data yimuhub/yimuduanju:${{ github.ref_name }}
            ```

