# 一幕·YIMU —— 全量单容器（自带 PostgreSQL，无需外部数据库）
# 用法：
#   docker compose -f deploy/docker-compose.allinone.yml up -d --build
#   访问 http://localhost:5173/app/yimu/
#
# 与三容器版（根目录 docker-compose.yml）的区别：
#   - 单容器：适合个人 / 小团队自部署，一条命令起，数据在命名卷里
#   - 三容器：app + postgres + redis 分离，适合企业版多实例、独立备份与扩容
name: yimuduanju-allinone

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.allinone
    image: yimuhub/yimuduanju:latest
    restart: unless-stopped
    environment:
      # 只发布到宿主回环时可用 127.0.0.1；需要局域网访问改成 0.0.0.0
      YIMU_LISTEN_HOST: 0.0.0.0
      YIMU_ALLOW_LAN: 'true'
      JOB_WORKER_CONCURRENCY: '2'
    ports:
      # 默认只绑本机回环：/api/* 无登录校验，暴露到局域网等于把数据交给同网段
      - '127.0.0.1:5173:5173'
    volumes:
      - yimu-data:/data
    mem_limit: 4g

volumes:
  yimu-data:
